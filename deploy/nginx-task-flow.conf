# Task Flow Web 서버(Nginx) 설정. 화면은 정적 파일로 직접 내주고 /api/ 요청만 App 서버(uvicorn)로 넘긴다.
# 설치: sudo bash deploy/setup-web.sh  (sites-available에 복사 → sites-enabled 연결 → 문법 검사 → reload)
# App 서버가 분리되면 proxy_pass의 127.0.0.1을 App 서버 사설 IP로 바꾼다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/task-flow/frontend;
    index index.html;

    # 할 일 등록 본문은 작으므로 작은 값으로 제한한다.
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
